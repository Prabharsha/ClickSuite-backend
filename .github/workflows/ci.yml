name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.2'
          cache: npm

      # postinstall runs `prisma generate`, so the client is ready after this.
      # The tests mock PrismaService, so no database is needed anywhere below.
      - run: npm ci

      - run: npm run lint:ci
      - run: npm run build
      - run: npm test
